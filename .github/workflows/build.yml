name: Build TaskTrail for Windows
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build TaskTrail.exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name TaskTrail --icon icon.ico
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml --exclude-module PySide6.QtMultimedia
          --exclude-module PySide6.QtCharts --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtDataVisualization
          --exclude-module PySide6.QtPdf --exclude-module PySide6.QtLocation
          tasktrail.py
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build installer
        run: |
          $env:Path += ";C:\Program Files (x86)\NSIS"
          makensis installer.nsi
      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: TaskTrail-Portable
          path: dist/TaskTrail.exe
          if-no-files-found: error
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TaskTrail-Setup
          path: TaskTrail-Setup-*.exe
          if-no-files-found: error
      - name: Attach to GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TaskTrail-Setup-*.exe
            dist/TaskTrail.exe
